<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMS AI</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span><span id="brandName">RMS AI</span></div>
    <div class="actions">
      <select id="modelSelect" class="model-select" title="Model" hidden></select>
      <button id="newChat" class="ghost-btn">New chat</button>
    </div>
  </header>

  <main id="chat" class="chat">
    <div id="empty" class="empty">
      <h1>How can I help?</h1>
      <p>Ask me anything.</p>
    </div>
    <div id="messages" class="messages"></div>
  </main>

  <div class="composer-wrap">
    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="Message RMS AI…" autofocus></textarea>
      <button id="send" type="submit" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 4l7 7-1.4 1.4L13 7.8V20h-2V7.8L6.4 12.4 5 11z"/>
        </svg>
      </button>
    </form>
    <div class="foot-note" id="footNote">RMS AI can make mistakes. Check important info.</div>
  </div>
</body>
</html>
